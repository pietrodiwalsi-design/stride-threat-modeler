<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Threat Modeler • v9</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap');
  body { font-family: 'Inter', system-ui, sans-serif; }
  .font-display { font-family: 'Space Grotesk', 'Inter', sans-serif; }
  
  .canvas { background: #fafafa; }
  .component-card {
    transition: all 0.1s cubic-bezier(0.23, 1.0, 0.32, 1);
    border: 1px solid #f0f0f3;
  }
  .component-card:hover {
    border-color: #e5e5ea;
    box-shadow: 0 4px 12px -2px rgb(0 0 0 / 0.05);
    transform: translateY(-1px);
  }
  .component-card.active {
    border-color: #0066ff;
    box-shadow: 0 0 0 3px rgba(0, 102, 255, 0.1);
  }
  
  .panel {
    box-shadow: -8px 0 30px -10px rgb(0 0 0 / 0.1);
  }
  
  .nav-active {
    background: #f0f4ff;
    color: #0066ff;
    font-weight: 600;
  }
  
  .threat-row {
    transition: background 0.1s ease;
  }
  .threat-row:hover {
    background: #fafafa;
  }
</style>
</head>
<body class="bg-zinc-50 text-zinc-950">

<div class="flex h-screen overflow-hidden">
  
  <!-- Left Sidebar -->
  <div class="w-72 border-r border-zinc-200 bg-white flex flex-col">
    <div class="px-6 pt-6 pb-4 border-b border-zinc-100">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-2xl bg-zinc-900 flex items-center justify-center">
          <span class="text-white text-sm font-semibold tracking-tighter">TM</span>
        </div>
        <div>
          <div class="font-semibold text-xl tracking-tighter">Threat Modeler</div>
          <div class="text-[10px] text-zinc-500 -mt-0.5">v9 • Canvas</div>
        </div>
      </div>
    </div>
    
    <div class="px-3 pt-4">
      <button onclick="createNewModel()" 
              class="w-full flex items-center justify-center gap-2 px-4 py-2.5 rounded-2xl bg-zinc-900 text-white text-sm font-medium hover:bg-zinc-950 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
        </svg>
        New Model
      </button>
    </div>
    
    <div class="px-3 pt-4 flex-1 overflow-auto">
      <div class="text-xs font-medium text-zinc-500 px-3 pb-1.5">Models</div>
      <div id="model-list" class="space-y-px"></div>
    </div>
    
    <div class="p-3 border-t border-zinc-100 text-[10px] text-zinc-400 px-4">
      Stored locally • v9-canvas
    </div>
  </div>
  
  <!-- Main Canvas -->
  <div class="flex-1 flex flex-col">
    
    <!-- Top Bar -->
    <div class="h-14 border-b border-zinc-200 bg-white px-6 flex items-center justify-between">
      <div class="flex items-center gap-4">
        <div id="model-header" class="font-semibold text-xl tracking-tight"></div>
        <div id="model-meta" class="text-xs text-zinc-500"></div>
      </div>
      
      <div class="flex items-center gap-2">
        <div class="flex rounded-2xl border border-zinc-200 p-0.5 text-xs">
          <button onclick="switchMethodology('STRIDE')" id="meth-STRIDE"
                  class="px-3 py-1 rounded-[14px] font-medium transition-colors">STRIDE</button>
          <button onclick="switchMethodology('LINDDUN')" id="meth-LINDDUN"
                  class="px-3 py-1 rounded-[14px] font-medium transition-colors text-zinc-500">LINDDUN</button>
        </div>
        
        <button onclick="exportReport()" 
                class="px-4 py-1.5 text-xs font-medium rounded-2xl border border-zinc-200 hover:bg-zinc-50 transition-colors">
          Export
        </button>
      </div>
    </div>
    
    <!-- Canvas Area -->
    <div class="flex-1 p-8 overflow-auto canvas">
      <div id="canvas-empty" class="max-w-md mx-auto text-center pt-12">
        <div class="mx-auto w-12 h-12 rounded-3xl bg-zinc-100 flex items-center justify-center mb-4">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-zinc-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2 5.5 5.5 0 0110 0v2" />
          </svg>
        </div>
        <div class="font-semibold text-xl tracking-tight">No components yet</div>
        <div class="text-sm text-zinc-500 mt-1">Add your first system area below</div>
      </div>
      
      <div id="canvas-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 max-w-[1200px] mx-auto hidden"></div>
    </div>
    
  </div>
  
  <!-- Right Panel -->
  <div id="right-panel" class="w-96 border-l border-zinc-200 bg-white hidden flex-col panel">
    <div class="px-5 pt-5 pb-4 border-b border-zinc-100 flex items-center justify-between">
      <div>
        <div id="panel-component-name" class="font-semibold text-xl tracking-tight"></div>
        <div id="panel-component-type" class="text-xs text-zinc-500"></div>
      </div>
      <button onclick="closePanel()" class="text-zinc-400 hover:text-zinc-600 p-1">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.25" d="M6 18L18 6M6 6h12v12" />
        </svg>
      </button>
    </div>
    
    <div class="flex-1 overflow-auto p-5 space-y-6">
      
      <!-- Add Threat -->
      <div>
        <div class="text-xs font-medium text-zinc-500 mb-2 px-1">Add threat</div>
        
        <div class="space-y-3">
          <select id="threat-category" class="w-full border border-zinc-200 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:border-zinc-400">
          </select>
          
          <textarea id="threat-desc" rows="2" placeholder="Describe the threat..." 
                    class="w-full border border-zinc-200 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:border-zinc-400 resize-y"></textarea>
          
          <div class="grid grid-cols-2 gap-3">
            <div>
              <div class="text-xs text-zinc-500 mb-1 px-1">Likelihood</div>
              <div class="flex gap-1" id="like-btns"></div>
            </div>
            <div>
              <div class="text-xs text-zinc-500 mb-1 px-1">Impact</div>
              <div class="flex gap-1" id="impact-btns"></div>
            </div>
          </div>
          
          <div>
            <div class="text-xs text-zinc-500 mb-1 px-1">Treatment</div>
            <div class="flex gap-1.5" id="treatment-btns">
              <button onclick="setTreatment('Mitigate')" id="treat-Mitigate" class="flex-1 text-xs py-1.5 rounded-2xl border border-zinc-200 font-medium">Mitigate</button>
              <button onclick="setTreatment('Transfer')" id="treat-Transfer" class="flex-1 text-xs py-1.5 rounded-2xl border border-zinc-200 font-medium">Transfer</button>
              <button onclick="setTreatment('Accept')" id="treat-Accept" class="flex-1 text-xs py-1.5 rounded-2xl border border-zinc-200 font-medium">Accept</button>
              <button onclick="setTreatment('Eliminate')" id="treat-Eliminate" class="flex-1 text-xs py-1.5 rounded-2xl border border-zinc-200 font-medium">Eliminate</button>
            </div>
          </div>
          
          <button onclick="addThreatFromPanel()" 
                  class="w-full py-3 text-sm font-semibold bg-zinc-900 text-white rounded-2xl hover:bg-black transition-colors">
            Add Threat
          </button>
        </div>
      </div>
      
      <!-- Threats List -->
      <div>
        <div class="flex items-center justify-between px-1 mb-2">
          <div class="text-xs font-medium text-zinc-500">Recorded threats</div>
          <div id="panel-threat-count" class="text-xs font-mono text-zinc-400"></div>
        </div>
        <div id="panel-threats-list" class="space-y-2 text-sm"></div>
      </div>
      
    </div>
    
    <div class="p-5 border-t border-zinc-100">
      <div class="flex items-center justify-between text-xs">
        <div class="text-zinc-500">Risk score</div>
        <div id="panel-risk-score" class="font-semibold text-lg tabular-nums"></div>
      </div>
    </div>
    
  </div>
  
</div>

<script>
let models = JSON.parse(localStorage.getItem('tm-v9') || '[]');
let currentModel = null;
let currentComponentId = null;
let currentMethodology = 'STRIDE';

const METHODS = {
  STRIDE: [
    {key:'S', label:'Spoofing', examples:['Stolen credentials','Forged token']},
    {key:'T', label:'Tampering', examples:['Data modification','Config tampering']},
    {key:'R', label:'Repudiation', examples:['Missing audit logs']},
    {key:'I', label:'Info Disclosure', examples:['Stack traces','PII in responses']},
    {key:'D', label:'Denial of Service', examples:['DDoS','Memory exhaustion']},
    {key:'E', label:'Elevation of Privilege', examples:['IDOR','JWT manipulation']}
  ],
  LINDDUN: [
    {key:'L', label:'Linkability', examples:['Cross-session tracking']},
    {key:'I', label:'Identifiability', examples:['IP + metadata re-identification']},
    {key:'N', label:'Non-repudiation', examples:['Immutable audit logs']},
    {key:'D', label:'Detectability', examples:['Timing attacks']},
    {key:'Di', label:'Disclosure', examples:['PII returned in APIs']},
    {key:'U', label:'Unawareness', examples:['Missing privacy notices']},
    {key:'Nc', label:'Non-compliance', examples:['GDPR retention violations']}
  ]
};

function save() {
  localStorage.setItem('tm-v9', JSON.stringify(models));
}

function renderModelList() {
  const container = document.getElementById('model-list');
  container.innerHTML = '';
  
  if (!models.length) {
    container.innerHTML = `<div class="px-3 py-2 text-xs text-zinc-400">No models yet</div>`;
    return;
  }
  
  models.forEach(model => {
    const el = document.createElement('div');
    el.className = `px-3 py-2.5 rounded-2xl cursor-pointer flex items-center justify-between text-sm ${currentModel && currentModel.id === model.id ? 'bg-zinc-100 font-medium' : 'hover:bg-zinc-50'}`;
    el.innerHTML = `
      <div class="truncate pr-2">${model.name}</div>
      <div class="text-[10px] text-zinc-400 tabular-nums">${model.components.length}</div>
    `;
    el.onclick = () => loadModel(model.id);
    container.appendChild(el);
  });
}

function createNewModel() {
  const name = prompt('Model name', 'Payment Service Assessment');
  if (!name) return;
  
  const model = {
    id: Date.now(),
    name,
    methodology: 'STRIDE',
    created: new Date().toISOString(),
    components: []
  };
  
  models.push(model);
  save();
  loadModel(model.id);
}

function loadModel(modelId) {
  currentModel = models.find(m => m.id === modelId);
  if (!currentModel) return;
  
  currentMethodology = currentModel.methodology || 'STRIDE';
  
  document.getElementById('model-header').textContent = currentModel.name;
  document.getElementById('model-meta').textContent = new Date(currentModel.created).toLocaleDateString();
  
  renderModelList();
  renderCanvas();
  updateMethodologyUI();
}

function updateMethodologyUI() {
  ['STRIDE','LINDDUN'].forEach(m => {
    const btn = document.getElementById('meth-' + m);
    if (!btn) return;
    if (m === currentMethodology) {
      btn.className = 'px-3 py-1 rounded-[14px] font-medium bg-white shadow-sm text-zinc-900';
    } else {
      btn.className = 'px-3 py-1 rounded-[14px] font-medium text-zinc-500 hover:text-zinc-700';
    }
  });
}

function switchMethodology(m) {
  if (!currentModel) return;
  currentModel.methodology = m;
  currentMethodology = m;
  save();
  updateMethodologyUI();
  renderCanvas();
}

function renderCanvas() {
  const grid = document.getElementById('canvas-grid');
  const empty = document.getElementById('canvas-empty');
  
  if (!currentModel || !currentModel.components.length) {
    grid.classList.add('hidden');
    empty.classList.remove('hidden');
    return;
  }
  
  grid.classList.remove('hidden');
  empty.classList.add('hidden');
  grid.innerHTML = '';
  
  currentModel.components.forEach(comp => {
    const card = document.createElement('div');
    card.className = `component-card bg-white rounded-3xl p-5 cursor-pointer ${currentComponentId === comp.id ? 'active' : ''}`;
    
    const threatCount = (comp.threats || []).length;
    const maxRisk = threatCount ? Math.max(...(comp.threats || []).map(t => (t.likelihood || 1) * (t.impact || 1))) : 0;
    
    card.innerHTML = `
      <div class="flex justify-between items-start">
        <div>
          <div class="font-semibold text-xl tracking-tight">${comp.name}</div>
          <div class="text-xs text-zinc-500 mt-0.5">${comp.type}</div>
        </div>
        ${threatCount ? `<div class="text-xs px-2.5 py-1 rounded-full bg-zinc-100 text-zinc-600 tabular-nums">${threatCount}</div>` : ''}
      </div>
      
      ${maxRisk ? `
      <div class="mt-4 pt-4 border-t border-zinc-100 flex items-center justify-between text-xs">
        <div class="text-zinc-500">Highest risk</div>
        <div class="font-mono font-semibold ${maxRisk >= 17 ? 'text-red-600' : maxRisk >= 10 ? 'text-orange-600' : 'text-emerald-600'}">${maxRisk}</div>
      </div>` : ''}
    `;
    
    card.onclick = () => openComponentPanel(comp.id);
    grid.appendChild(card);
  });
}

function addComponent() {
  if (!currentModel) return;
  const name = prompt('Component / Area name', 'Auth Service');
  if (!name) return;
  
  const comp = {
    id: Date.now(),
    name,
    type: 'Process',
    threats: []
  };
  
  currentModel.components.push(comp);
  save();
  renderCanvas();
}

function openComponentPanel(compId) {
  currentComponentId = compId;
  const comp = currentModel.components.find(c => c.id === compId);
  if (!comp) return;
  
  document.getElementById('panel-component-name').textContent = comp.name;
  document.getElementById('panel-component-type').textContent = comp.type;
  
  const catSelect = document.getElementById('threat-category');
  catSelect.innerHTML = '';
  const cats = METHODS[currentMethodology] || METHODS.STRIDE;
  cats.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c.key + ' - ' + c.label;
    opt.textContent = c.key + ' — ' + c.label;
    catSelect.appendChild(opt);
  });
  
  renderPanelThreats();
  renderScoreButtons();
  
  document.getElementById('right-panel').classList.remove('hidden');
  document.getElementById('right-panel').classList.add('flex');
  
  renderCanvas();
}

function closePanel() {
  document.getElementById('right-panel').classList.remove('flex');
  document.getElementById('right-panel').classList.add('hidden');
  currentComponentId = null;
  renderCanvas();
}

let tempL = 3, tempI = 3, tempTreatment = 'Mitigate';

function renderScoreButtons() {
  ['like','impact'].forEach(type => {
    const container = document.getElementById(type + '-btns');
    container.innerHTML = '';
    for (let n=1; n<=5; n++) {
      const btn = document.createElement('button');
      btn.className = `flex-1 py-1.5 text-xs rounded-2xl border transition-all ${n <= 2 ? 'border-emerald-200 text-emerald-700' : n === 3 ? 'border-amber-200 text-amber-700' : 'border-orange-200 text-orange-700'}`;
      btn.textContent = n;
      btn.onclick = () => {
        if (type === 'like') tempL = n; else tempI = n;
        renderScoreButtons();
      };
      if ((type === 'like' ? tempL : tempI) === n) {
        btn.style.background = n <= 2 ? '#dcfce7' : n === 3 ? '#fefce8' : '#ffedd5';
        btn.style.borderColor = n <= 2 ? '#4ade80' : n === 3 ? '#fde047' : '#fb923c';
      }
      container.appendChild(btn);
    }
  });
}

function setTreatment(t) {
  tempTreatment = t;
  ['Mitigate','Transfer','Accept','Eliminate'].forEach(tr => {
    const b = document.getElementById('treat-' + tr);
    if (!b) return;
    if (tr === t) {
      b.style.background = '#18181b';
      b.style.color = 'white';
      b.style.borderColor = '#18181b';
    } else {
      b.style.background = '';
      b.style.color = '';
      b.style.borderColor = '';
    }
  });
}

function addThreatFromPanel() {
  if (!currentModel || !currentComponentId) return;
  
  const comp = currentModel.components.find(c => c.id === currentComponentId);
  const desc = document.getElementById('threat-desc').value.trim();
  const cat = document.getElementById('threat-category').value;
  
  if (!desc) return alert('Please describe the threat');
  
  if (!comp.threats) comp.threats = [];
  comp.threats.push({
    id: Date.now(),
    category: cat,
    desc,
    likelihood: tempL,
    impact: tempI,
    treatment: tempTreatment,
    created: new Date().toISOString()
  });
  
  save();
  renderPanelThreats();
  renderCanvas();
  document.getElementById('threat-desc').value = '';
}

function renderPanelThreats() {
  const container = document.getElementById('panel-threats-list');
  const countEl = document.getElementById('panel-threat-count');
  container.innerHTML = '';
  
  const comp = currentModel.components.find(c => c.id === currentComponentId);
  if (!comp || !comp.threats || !comp.threats.length) {
    container.innerHTML = `<div class="text-xs text-zinc-400 px-1 py-4">No threats recorded yet</div>`;
    countEl.textContent = '';
    return;
  }
  
  countEl.textContent = comp.threats.length;
  
  comp.threats.forEach((t) => {
    const score = t.likelihood * t.impact;
    const row = document.createElement('div');
    row.className = 'threat-row border border-zinc-100 rounded-2xl px-4 py-3 text-xs';
    row.innerHTML = `
      <div class="font-medium">${t.desc}</div>
      <div class="flex items-center gap-2 mt-1.5 text-[10px]">
        <span class="px-2 py-px rounded bg-zinc-100 text-zinc-600">${t.category.split(' - ')[0]}</span>
        <span class="tabular-nums">L${t.likelihood}×I${t.impact}=${score}</span>
        <span class="text-emerald-600">${t.treatment}</span>
      </div>
    `;
    container.appendChild(row);
  });
}

function exportReport() {
  if (!currentModel) return;
  alert('Export coming in next version.');
}

function init() {
  renderModelList();
  
  if (!models.length) {
    const demo = {
      id: Date.now(),
      name: "Customer Portal",
      methodology: "STRIDE",
      created: new Date().toISOString(),
      components: [
        {id: Date.now()+1, name: "Auth Service", type: "Process", threats: []},
        {id: Date.now()+2, name: "User Database", type: "DataStore", threats: []}
      ]
    };
    models.push(demo);
    save();
    renderModelList();
  }
}

init();
</script>
</body>
</html>
