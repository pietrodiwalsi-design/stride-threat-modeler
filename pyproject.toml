[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stride-threat-modeler"
version = "1.0.0"
description = "Continuous STRIDE Threat Modeling Engine & Model Context Protocol (MCP) Server"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0.0"
]

[project.scripts]
stride-modeler = "stride_modeler.cli:main"
stride-mcp = "stride_modeler.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
